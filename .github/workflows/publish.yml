# 推 v* tag 时从 GitHub Actions 发包，并生成 OIDC provenance。
# 发布闸门由 ENABLE_NPM_PUBLISH 控制，未开启时跳过。

name: Publish to npm (OIDC)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write   # 供 npm OIDC 签发临时令牌
  contents: read

jobs:
  publish:
    # 未显式启用时跳过，避免推 tag / 手动触发误发 npm 包
    if: ${{ vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install (ci)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish (provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
