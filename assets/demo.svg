<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 760 380" width="760" height="380" role="img"
     aria-label="agent-core 元认知环动图：核心引擎驱动 think → act → reflect 循环，分级自主护栏可控">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1832"/>
      <stop offset="1" stop-color="#0d0b1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7bff"/>
      <stop offset="1" stop-color="#37d5d3"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="760" height="380" fill="url(#bg)"/>
  <text x="380" y="34" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700">会思考、可控自治的 Agent 核心</text>
  <text x="380" y="57" text-anchor="middle" fill="#9B96C9" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">Meta-cognition engine · 分级自主护栏 · 可注入可测试</text>
  <path id="ring" d="M380,150 L255,288 L505,288 Z" fill="none" stroke="#2c2650" stroke-width="2"/>
  <circle r="5" fill="#37d5d3"><animateMotion dur="3s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#ring"/></animateMotion></circle>
  <circle cx="380" cy="241" r="48" fill="#8a7bff" opacity="0.30" filter="url(#glow)"><animate attributeName="opacity" values="0.18;0.55;0.18" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="241" r="40" fill="#241d44" stroke="#8a7bff" stroke-width="2"/>
  <text x="380" y="247" text-anchor="middle" fill="#fff" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="700">CORE</text>
  <g opacity="1">
    <circle cx="380" cy="150" r="26" fill="#15122a" stroke="#37d5d3" stroke-width="2"/>
    <text x="380" y="155" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">think</text>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite" begin="0s"/>
  </g>
  <g opacity="1">
    <circle cx="505" cy="288" r="26" fill="#15122a" stroke="#ff7ac3" stroke-width="2"/>
    <text x="505" y="293" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">act</text>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite" begin="1s"/>
  </g>
  <g opacity="1">
    <circle cx="255" cy="288" r="26" fill="#15122a" stroke="#8a7bff" stroke-width="2"/>
    <text x="255" y="293" text-anchor="middle" fill="#ECEAFF" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="700">reflect</text>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite" begin="2s"/>
  </g>
  <text x="380" y="338" text-anchor="middle" fill="#9B96C9" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12">think → act → reflect · 分级自主 L1–L3 · 影子模式 · 单日熔断</text>
  <text x="380" y="366" text-anchor="middle" fill="#6f6a96" font-family="sans-serif" font-size="11">agent-core — 把元认知做成可测试、可注入的架构</text>
</svg>
